<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 Assignment</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
        <button id="theme-toggle">Dark mode</button>
    </header>
    
    <main>
        <label for="note-text">Your Draft:</label>
        <textarea id="note-text" rows="8" placeholder="Start typing your draft here..."></textarea>
        
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
        
        <button id="clear-btn">Clear</button>
    </main>
</body>
</html>
